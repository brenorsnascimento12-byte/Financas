name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite lançar manualmente a partir do separador Actions, sem precisar de um push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez: um push novo cancela o anterior em vez de os deixar corridos à corrida.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Descobre o subcaminho certo (/nome-do-repo/, ou / se for um site de utilizador)
      # em vez de o assumirmos fixo — funciona seja qual for o nome dado ao repositório.
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
