<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Fotografia de outubro · telemóvel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
h1,h2,h3,p{margin:0}
.t{--surface-1:#fcfcfb;--plane:#f9f9f7;--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#898781;--gridline:#e1e0d9;--baseline:#c3c2b7;--border:rgba(11,11,11,.1);--wash:rgba(11,11,11,.04);--serie-1:#2a78d6;--serie-2:#eb6834;--serie-3:#1baf7a;--good:#0ca30c;--success-text:#006300;--warning:#fab219;--critical:#d03b3b;--raio:10px;--sans:system-ui,-apple-system,'Segoe UI',sans-serif;--warning-text:#7a5200;--warning-wash:rgba(250,178,25,.16);--good-wash:rgba(12,163,12,.09);--sombra-elevada:0 10px 28px rgba(11,11,11,.14);--scrim:rgba(11,11,11,.32);font-family:var(--sans);color:var(--text-primary);background:var(--surface-1);font-variant-numeric:tabular-nums}
.t.escuro{--surface-1:#1a1a19;--plane:#0d0d0d;--text-primary:#fff;--text-secondary:#c3c2b7;--text-muted:#898781;--gridline:#2c2c2a;--baseline:#383835;--border:rgba(255,255,255,.1);--wash:rgba(255,255,255,.05);--serie-1:#3987e5;--serie-2:#d95926;--serie-3:#199e70;--success-text:#0ca30c;--warning-text:#fab219;--warning-wash:rgba(250,178,25,.12);--good-wash:rgba(12,163,12,.14);--sombra-elevada:0 10px 28px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6)}
.lbl{font-size:13px;line-height:18px;color:var(--text-secondary)}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.inp{position:relative}
.inp input{width:100%;box-sizing:border-box;height:60px;padding:0 44px 0 16px;font:600 28px var(--sans);font-variant-numeric:tabular-nums;text-align:right;color:var(--text-primary);background:var(--plane);border:1px solid var(--border);border-radius:var(--raio);outline:none}
.inp input::placeholder{color:var(--text-muted);font-weight:400}
.inp input.foco{border-color:var(--serie-1);box-shadow:0 0 0 1px var(--serie-1)}
.inp span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--text-secondary)}
.btn{min-height:52px;padding:0 18px;border-radius:var(--raio);border:0;background:var(--text-primary);color:var(--surface-1);font:600 16px var(--sans);cursor:pointer}
.x{width:44px;height:44px;border:0;border-radius:22px;background:var(--wash);color:var(--text-secondary);display:grid;place-items:center;cursor:pointer;padding:0}
</style>
</helmet>
<div class="{{tema}}" style="width: 390px; height: 1100px; box-sizing: border-box; background: var(--scrim); padding-top: 24px; display: flex; flex-direction: column">
  <section role="dialog" aria-modal="true" aria-labelledby="fm" style="flex: 1; background: var(--surface-1); border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 4px">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: var(--baseline); align-self: center"></div>
      <div style="display: flex; align-items: center; gap: 12px; padding-top: 8px">
        <div style="flex: 1">
          <h2 id="fm" style="font-size: 22px; line-height: 28px; font-weight: 650">Fotografia de outubro</h2>
          <p class="lbl">Valor de mercado a 31 out. · copia da corretora</p>
        </div>
        <button class="x" type="button" aria-label="Fechar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
      </div>
    </div>

    <div style="padding: 20px 16px; display: flex; flex-direction: column; gap: 18px">
      <div class="campo">
        <label for="m-iwda"><span style="font-size: 15px; font-weight: 600">IWDA</span><span class="lbl">set.: 10 540,20 €</span></label>
        <div class="inp"><input id="m-iwda" class="foco" inputmode="decimal" autocomplete="off" value="10 652,4"><span>€</span></div>
      </div>
      <div class="campo">
        <label for="m-eimi"><span style="font-size: 15px; font-weight: 600">EIMI</span><span class="lbl">set.: 868,10 €</span></label>
        <div class="inp"><input id="m-eimi" inputmode="decimal" autocomplete="off" placeholder="868,10"><span>€</span></div>
      </div>
      <div class="campo">
        <label for="m-def"><span style="font-size: 15px; font-weight: 600">VanEck Defense</span><span class="lbl">set.: 496,30 €</span></label>
        <div class="inp"><input id="m-def" inputmode="decimal" autocomplete="off" placeholder="496,30"><span>€</span></div>
      </div>
      <div class="campo">
        <label for="m-dig"><span style="font-size: 15px; font-weight: 600">iShares Digital Security</span><span class="lbl">set.: 497,80 €</span></label>
        <div class="inp"><input id="m-dig" inputmode="decimal" autocomplete="off" placeholder="497,80"><span>€</span></div>
      </div>
      <div style="height: 1px; background: var(--gridline)"></div>
      <div class="campo">
        <label for="m-ca"><span style="font-size: 15px; font-weight: 600">Certificados de Aforro · saldo</span><span class="lbl">set.: 2 100,00 €</span></label>
        <div class="inp"><input id="m-ca" inputmode="decimal" autocomplete="off" placeholder="2 100,00"><span>€</span></div>
      </div>
    </div>

    <div style="margin-top: auto; padding: 12px 16px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; background: var(--surface-1)">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span class="lbl">1 de 5 preenchidos · os vazios ficam com o valor de setembro</span>
      </div>
      <button class="btn" type="button">Guardar fotografia</button>
    </div>
    <div style="height: 290px; margin: 0 8px 8px; border: 1px dashed var(--baseline); border-radius: 12px; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box">
      <p class="lbl">Teclado numérico do sistema<br>(input com inputmode="decimal")</p>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return { tema: (this.props.tema ?? 'claro') === 'escuro' ? 't escuro' : 't' };
  }
}
</script>
</body>
</html>
